<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">

    <script>
        // Tema, özel renk paleti ve dil (sayfa yüklenmeden önce çalışır, titremeyi önler)
        (function () {
            const d = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isLight = savedTheme === 'light' || (!savedTheme && !systemPrefersDark);
            if (isLight) d.classList.add('light-mode');
            const a = localStorage.getItem('custom_accent');
            const t = localStorage.getItem('custom_text');
            const b = localStorage.getItem('custom_bg');
            if (a) d.style.setProperty('--accent-color', a);
            if (t) d.style.setProperty('--text-color', t);
            if (b) {
                d.style.setProperty('--bg-color', b);
                d.style.setProperty('--card-bg', b);
            }
            // Özel arka plan var, yazı rengi seçilmemişse okunabilir renkleri zeminin açıklığına göre seç
            if (b && !t) {
                const m = /^#([0-9a-f]{6})$/i.exec(b.trim());
                if (m) {
                    const n = parseInt(m[1], 16);
                    const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
                    const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
                    const bgIsLight = L > 0.18;
                    d.style.setProperty('--text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    d.style.setProperty('--text-muted', bgIsLight ? '#475569' : '#cbd5e1');
                    d.style.setProperty('--border-color', bgIsLight ? 'rgba(15,23,42,0.18)' : 'rgba(248,250,252,0.22)');
                }
            }
            // Safari üst/alt çubuğu sayfa zemin rengine uysun
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', b || (isLight ? '#f8fafc' : '#0b1120'));

            // Dil ve yön (RTL)
            const lang = localStorage.getItem('user_lang') || 'tr';
            d.setAttribute('lang', lang);
            d.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        })();
    </script>
    <title data-i18n="page_title">Ayetin Vakti - Kaza Namazı Takibi</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #10b981;
            --border-color: #334155;
            --btn-minus-bg: #334155;
            color-scheme: dark;
        }

        html.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent-color: #0d9488;
            --border-color: #e2e8f0;
            --btn-minus-bg: #e2e8f0;
            color-scheme: light;
        }

        /* Tuşlara ard arda basınca sayfa yakınlaşmasın */
        html, body, button, a, select, input, label, [onclick] { touch-action: manipulation; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        header {
            padding: 14px 16px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-color);
        }

        .back-btn, .theme-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: var(--card-bg);
        }

        .container {
            flex: 1;
            padding: 16px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card h2 {
            font-size: 1rem;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reset-all-btn {
            background: none;
            border: 1px solid #ef4444;
            color: #ef4444;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .reset-all-btn:active {
            opacity: 0.7;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .input-group input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            color: var(--text-color);
            font-size: 0.9rem;
            text-align: center;
            outline: none;
            width: 100%;
        }

        .btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
        }

        html:not(.light-mode) .btn {
            color: #0f172a;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn.secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted) !important;
            font-weight: 600;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px dashed var(--accent-color);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .total-row .total-value {
            color: var(--accent-color);
            font-size: 1rem;
        }

        .bulk-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .debt-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .debt-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .debt-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .debt-info span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .debt-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .debt-actions input {
            width: 65px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px;
            color: var(--text-color);
            text-align: center;
            font-size: 0.9rem;
            outline: none;
        }

        .action-btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        html:not(.light-mode) .action-btn {
            color: #0f172a;
        }

        .action-btn.minus {
            background-color: var(--btn-minus-bg);
            color: var(--text-color) !important;
        }
    </style>
</head>
<body>

    <header>
        <a href="https://ayetinvakti.github.io/" class="back-btn" aria-label="Geri">←</a>
        <h1 data-i18n="header_title">⏳ Kaza Namazı Takibi</h1>
        <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Tema Değiştir">🌙</button>
    </header>

    <div class="container">
        <div class="card">
            <h2 data-i18n="calc_header">📊 Pratik Kaza Hesaplayıcı</h2>
            <div class="calc-grid">
                <div class="input-group">
                    <label for="calcYil" data-i18n="label_yil">Yıl</label>
                    <input type="number" id="calcYil" placeholder="0" min="0" inputmode="numeric" pattern="[0-9]*">
                </div>
                <div class="input-group">
                    <label for="calcAy" data-i18n="label_ay">Ay</label>
                    <input type="number" id="calcAy" placeholder="0" min="0" inputmode="numeric" pattern="[0-9]*">
                </div>
                <div class="input-group">
                    <label for="calcGun" data-i18n="label_gun">Gün</label>
                    <input type="number" id="calcGun" placeholder="0" min="0" inputmode="numeric" pattern="[0-9]*">
                </div>
            </div>
            <button class="btn" onclick="hesaplaVeEkle()" data-i18n="btn_ekle">Borçlara Ekle</button>
        </div>

        <div class="card">
            <div class="card-header-row">
                <h2 data-i18n="debts_header">📝 Kaza Borçlarım</h2>
                <button class="reset-all-btn" onclick="tumunuSifirla()" data-i18n="btn_reset">Sıfırla</button>
            </div>
            <div class="total-row">
                <span data-i18n="total_label">Toplam Kalan Borç:</span>
                <span class="total-value" id="totalValue">0</span>
            </div>
            <div class="debt-list" id="debtList"></div>
            <div class="bulk-actions">
                <button class="btn" onclick="birGunKildim()" data-i18n="btn_gun_kildim">✅ Bir Günlük Kazayı Kıldım (−1 gün)</button>
                <button class="btn secondary" id="undoBtn" onclick="geriAl()" style="display: none;" data-i18n="btn_undo">↩️ Son İşlemi Geri Al</button>
            </div>
        </div>
    </div>

    <script>
        // Dil Sözlüğü
        const translations = {
            tr: {
                page_title: "Ayetin Vakti - Kaza Namazı Takibi",
                header_title: "⏳ Kaza Namazı Takibi",
                calc_header: "📊 Pratik Kaza Hesaplayıcı",
                label_yil: "Yıl",
                label_ay: "Ay",
                label_gun: "Gün",
                btn_ekle: "Borçlara Ekle",
                debts_header: "📝 Kaza Borçlarım",
                btn_reset: "Sıfırla",
                total_label: "Toplam Kalan Borç:",
                btn_gun_kildim: "✅ Bir Günlük Kazayı Kıldım (−1 gün)",
                btn_undo: "↩️ Son İşlemi Geri Al",
                minus_label: "Azalt",
                plus_label: "Arttır",
                sabah: "Sabah Namazı",
                ogle: "Öğle Namazı",
                ikindi: "İkindi Namazı",
                aksam: "Akşam Namazı",
                yatsi: "Yatsı Namazı",
                vitir: "Vitir Namazı",
                kalan_borc: "Kalan Borç: ",
                vakit: " vakit",
                alert_gecersiz: "Lütfen geçerli bir süre girin kardeşim!",
                alert_eklendi: " günlük kaza borcu listeye başarıyla eklendi kardeşim!",
                confirm_sifirla: "Tüm kaza borçlarını sıfırlamak istediğinden emin misin kardeşim?"
            },
            en: {
                page_title: "Ayetin Vakti - Qada Prayer Tracker",
                header_title: "⏳ Qada Prayer Tracker",
                calc_header: "📊 Quick Qada Calculator",
                label_yil: "Year",
                label_ay: "Month",
                label_gun: "Day",
                btn_ekle: "Add to Debts",
                debts_header: "📝 My Qada Debts",
                btn_reset: "Reset",
                total_label: "Total Remaining:",
                btn_gun_kildim: "✅ I Prayed One Day of Qada (−1 day)",
                btn_undo: "↩️ Undo Last Action",
                minus_label: "Decrease",
                plus_label: "Increase",
                sabah: "Fajr Prayer",
                ogle: "Dhuhr Prayer",
                ikindi: "Asr Prayer",
                aksam: "Maghrib Prayer",
                yatsi: "Isha Prayer",
                vitir: "Witr Prayer",
                kalan_borc: "Remaining Debt: ",
                vakit: " prayers",
                alert_gecersiz: "Please enter a valid duration, my friend!",
                alert_eklendi: " days of qada debt successfully added to the list!",
                confirm_sifirla: "Are you sure you want to reset all qada debts, my friend?"
            },
            ar: {
                page_title: "آية الوقت - تتبع الصلوات الفوائت",
                header_title: "⏳ تتبع الصلوات الفوائت",
                calc_header: "📊 حاسبة الفوائت السريعة",
                label_yil: "سنة",
                label_ay: "شهر",
                label_gun: "يوم",
                btn_ekle: "إضافة إلى الديون",
                debts_header: "📝 ديوني من الصلوات",
                btn_reset: "إعادة تعيين",
                total_label: "إجمالي المتبقي:",
                btn_gun_kildim: "✅ قضيت صلوات يوم واحد (−1 يوم)",
                btn_undo: "↩️ تراجع عن آخر إجراء",
                minus_label: "إنقاص",
                plus_label: "زيادة",
                sabah: "صلاة الفجر",
                ogle: "صلاة الظهر",
                ikindi: "صلاة العصر",
                aksam: "صلاة المغرب",
                yatsi: "صلاة العشاء",
                vitir: "صلاة الوتر",
                kalan_borc: "الدين المتبقي: ",
                vakit: " صلاة",
                alert_gecersiz: "الرجاء إدخال مدة صحيحة يا أخي!",
                alert_eklendi: " أيام من قضاء الصلاة أضيفت بنجاح للقائمة يا أخي!",
                confirm_sifirla: "هل أنت متأكد أنك تريد إعادة تعيين جميع ديون الصلوات يا أخي؟"
            }
        };

        const currentLang = translations[localStorage.getItem('user_lang')] ? localStorage.getItem('user_lang') : 'tr';
        const t = translations[currentLang];
        const numLocale = { tr: 'tr-TR', en: 'en-US', ar: 'ar-u-nu-latn' }[currentLang];

        // ===================== TEMA =====================
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        function updateThemeButton() {
            if (themeToggleBtn) themeToggleBtn.textContent = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
        }

        // Safari üst/alt çubuğu sayfa zemin rengine uysun
        function updateThemeColor() {
            const meta = document.querySelector('meta[name="theme-color"]');
            if (!meta) return;
            const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
            if (bg) meta.setAttribute('content', bg);
        }

        function toggleTheme() {
            const isLight = document.documentElement.classList.toggle('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            updateThemeButton();
            updateThemeColor();
        }

        updateThemeButton();
        updateThemeColor();

        // ===================== KAZA BORÇLARI =====================
        const debtKeys = ['sabah', 'ogle', 'ikindi', 'aksam', 'yatsi', 'vitir'];
        const MAX_DEBT = 1000000;   // saçma/aşırı değerleri önlemek için üst sınır

        function emptyDebts() {
            const o = {};
            debtKeys.forEach(k => { o[k] = 0; });
            return o;
        }

        // DÜZELTME: Bozuk / eksik / metin olarak kaydedilmiş veri sayfayı bozmasın
        function loadDebts() {
            const out = emptyDebts();
            try {
                const raw = JSON.parse(localStorage.getItem('kazaBorclari'));
                if (raw && typeof raw === 'object') {
                    debtKeys.forEach(k => {
                        const v = parseInt(raw[k], 10);
                        out[k] = (isNaN(v) || v < 0) ? 0 : Math.min(v, MAX_DEBT);
                    });
                }
            } catch (e) { /* bozuk kayıt: sıfırdan başla */ }
            return out;
        }

        let debts = loadDebts();
        let undoSnapshot = null;    // son toplu işlemden önceki durum (geri almak için)

        function saveDebts() {
            try { localStorage.setItem('kazaBorclari', JSON.stringify(debts)); } catch (e) { /* kota dolu olabilir */ }
        }

        function fmt(n) {
            return Number(n).toLocaleString(numLocale);
        }

        function takeSnapshot() {
            undoSnapshot = Object.assign({}, debts);
        }

        function renderDebts() {
            const listContainer = document.getElementById('debtList');
            if (!listContainer) return;

            // DÜZELTME: Her satır için innerHTML += yerine tek seferde çizim
            listContainer.innerHTML = debtKeys.map(key => `
                <div class="debt-item">
                    <div class="debt-info">
                        <h3>${t[key] || key}</h3>
                        <span>${t.kalan_borc}${fmt(debts[key])}${t.vakit}</span>
                    </div>
                    <div class="debt-actions">
                        <button class="action-btn minus" aria-label="${t.minus_label}" onclick="changeDebt('${key}', -1)">-</button>
                        <input type="number" id="input-${key}" value="${debts[key]}" min="0" onchange="updateDirect('${key}', this.value)" inputmode="numeric" pattern="[0-9]*" aria-label="${t[key] || key}">
                        <button class="action-btn" aria-label="${t.plus_label}" onclick="changeDebt('${key}', 1)">+</button>
                    </div>
                </div>
            `).join('');

            const total = debtKeys.reduce((sum, k) => sum + debts[k], 0);
            document.getElementById('totalValue').textContent = fmt(total) + t.vakit;
            document.getElementById('undoBtn').style.display = undoSnapshot ? 'block' : 'none';
        }

        function changeDebt(key, amount) {
            debts[key] = Math.min(MAX_DEBT, Math.max(0, debts[key] + amount));
            saveDebts();
            renderDebts();
        }

        function updateDirect(key, value) {
            const val = parseInt(value, 10);
            debts[key] = (isNaN(val) || val < 0) ? 0 : Math.min(val, MAX_DEBT);
            saveDebts();
            renderDebts();
        }

        function hesaplaVeEkle() {
            // DÜZELTME: Eksi değerler 0 kabul edilir (örn. -1 yıl + 400 gün ile hesap bozulmaz)
            const yil = Math.max(0, parseInt(document.getElementById('calcYil').value, 10) || 0);
            const ay = Math.max(0, parseInt(document.getElementById('calcAy').value, 10) || 0);
            const gun = Math.max(0, parseInt(document.getElementById('calcGun').value, 10) || 0);

            const toplamGun = (yil * 365) + (ay * 30) + gun;

            if (toplamGun <= 0) {
                alert(t.alert_gecersiz);
                return;
            }

            takeSnapshot();
            debtKeys.forEach(key => {
                debts[key] = Math.min(MAX_DEBT, debts[key] + toplamGun);
            });

            document.getElementById('calcYil').value = '';
            document.getElementById('calcAy').value = '';
            document.getElementById('calcGun').value = '';

            saveDebts();
            renderDebts();
            alert(fmt(toplamGun) + t.alert_eklendi);
        }

        // YENİ: Bir günlük kazayı (6 vakit) tek dokunuşla düş
        function birGunKildim() {
            const total = debtKeys.reduce((sum, k) => sum + debts[k], 0);
            if (total <= 0) return;
            takeSnapshot();
            debtKeys.forEach(key => { debts[key] = Math.max(0, debts[key] - 1); });
            saveDebts();
            renderDebts();
        }

        function tumunuSifirla() {
            if (confirm(t.confirm_sifirla)) {
                takeSnapshot();
                debtKeys.forEach(key => { debts[key] = 0; });
                saveDebts();
                renderDebts();
            }
        }

        // YENİ: Toplu işlemleri (ekle / bir gün düş / sıfırla) geri al
        function geriAl() {
            if (!undoSnapshot) return;
            debts = Object.assign(emptyDebts(), undoSnapshot);
            undoSnapshot = null;
            saveDebts();
            renderDebts();
        }

        // Sayfa Metinlerini Dile Göre Düzenleme
        document.querySelectorAll('[data-i18n]').forEach(element => {
            const key = element.getAttribute('data-i18n');
            if (t[key]) {
                if (element.tagName === 'TITLE') document.title = t[key];
                else element.textContent = t[key];
            }
        });
        document.title = t.page_title;

        renderDebts();
    </script>
</body>
</html>
