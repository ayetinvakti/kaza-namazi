<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ayetin Vakti - Kaza Namazı Takibi</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --primary-color: #0d9488;
            --border-color: #e2e8f0;
            --btn-minus-bg: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #14b8a6;
            --border-color: #334155;
            --btn-minus-bg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        header {
            padding: 14px 16px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn, .theme-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: var(--card-bg);
        }

        .container {
            flex: 1;
            padding: 16px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card h2 {
            font-size: 1rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reset-all-btn {
            background: none;
            border: 1px solid #ef4444;
            color: #ef4444;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .reset-all-btn:active {
            opacity: 0.7;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .input-group input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            color: var(--text-color);
            font-size: 0.9rem;
            text-align: center;
            outline: none;
            width: 100%;
        }

        .btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
        }

        [data-theme="dark"] .btn {
            color: #0f172a;
        }

        .btn:active {
            opacity: 0.8;
        }

        .debt-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .debt-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .debt-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .debt-info span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .debt-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .debt-actions input {
            width: 65px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px;
            color: var(--text-color);
            text-align: center;
            font-size: 0.9rem;
            outline: none;
        }

        .action-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        [data-theme="dark"] .action-btn {
            color: #0f172a;
        }

        .action-btn.minus {
            background-color: var(--btn-minus-bg);
            color: var(--text-color);
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <a href="https://ayetinvakti.github.io/" class="back-btn">←</a>
        <h1>⏳ Kaza Namazı Takibi</h1>
        <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
    </header>

    <div class="container">
        <div class="card">
            <h2>📊 Pratik Kaza Hesaplayıcı</h2>
            <div class="calc-grid">
                <div class="input-group">
                    <label>Yıl</label>
                    <input type="number" id="calcYil" placeholder="0" min="0" inputmode="numeric" pattern="[0-9]*">
                </div>
                <div class="input-group">
                    <label>Ay</label>
                    <input type="number" id="calcAy" placeholder="0" min="0" inputmode="numeric" pattern="[0-9]*">
                </div>
                <div class="input-group">
                    <label>Gün</label>
                    <input type="number" id="calcGun" placeholder="0" min="0" inputmode="numeric" pattern="[0-9]*">
                </div>
            </div>
            <button class="btn" onclick="hesaplaVeEkle()">Borçlara Ekle / Güncelle</button>
        </div>

        <div class="card">
            <div class="card-header-row">
                <h2>📝 Kaza Borçlarım</h2>
                <button class="reset-all-btn" onclick="tumunuSifirla()">Sıfırla</button>
            </div>
            <div class="debt-list" id="debtList"></div>
        </div>
    </div>

    <script>
        // Tema Ayarları
        const bodyEl = document.body;
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        function setTheme(theme) {
            bodyEl.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        function toggleTheme() {
            const currentTheme = bodyEl.getAttribute('data-theme');
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        setTheme(savedTheme);

        // Kaza Borçları Mantığı
        let debts = JSON.parse(localStorage.getItem('kazaBorclari')) || {
            sabah: 0,
            ogle: 0,
            ikindi: 0,
            aksam: 0,
            yatsi: 0,
            vitir: 0
        };

        const debtNames = {
            sabah: "Sabah Namazı",
            ogle: "Öğle Namazı",
            ikindi: "İkindi Namazı",
            aksam: "Akşam Namazı",
            yatsi: "Yatsı Namazı",
            vitir: "Vitir Namazı"
        };

        function renderDebts() {
            const listContainer = document.getElementById('debtList');
            listContainer.innerHTML = '';

            for (let key in debts) {
                listContainer.innerHTML += `
                    <div class="debt-item">
                        <div class="debt-info">
                            <h3>${debtNames[key]}</h3>
                            <span>Kalan Borç: ${debts[key]} vakit</span>
                        </div>
                        <div class="debt-actions">
                            <button class="action-btn minus" onclick="changeDebt('${key}', -1)">-</button>
                            <input type="number" id="input-${key}" value="${debts[key]}" onchange="updateDirect('${key}', this.value)" inputmode="numeric" pattern="[0-9]*">
                            <button class="action-btn" onclick="changeDebt('${key}', 1)">+</button>
                        </div>
                    </div>
                `;
            }
            localStorage.setItem('kazaBorclari', JSON.stringify(debts));
        }

        function changeDebt(key, amount) {
            debts[key] = Math.max(0, debts[key] + amount);
            renderDebts();
        }

        function updateDirect(key, value) {
            let val = parseInt(value);
            debts[key] = isNaN(val) || val < 0 ? 0 : val;
            renderDebts();
        }

        function hesaplaVeEkle() {
            let yil = parseInt(document.getElementById('calcYil').value) || 0;
            let ay = parseInt(document.getElementById('calcAy').value) || 0;
            let gun = parseInt(document.getElementById('calcGun').value) || 0;

            let toplamGun = (yil * 365) + (ay * 30) + gun;

            if (toplamGun <= 0) {
                alert("Lütfen geçerli bir süre girin kardeşim!");
                return;
            }

            for (let key in debts) {
                debts[key] += toplamGun;
            }

            document.getElementById('calcYil').value = '';
            document.getElementById('calcAy').value = '';
            document.getElementById('calcGun').value = '';

            renderDebts();
            alert(toplamGun + " günlük kaza borcu listeye başarıyla eklendi kardeşim!");
        }

        function tumunuSifirla() {
            if (confirm("Tüm kaza borçlarını sıfırlamak istediğinden emin misin kardeşim?")) {
                for (let key in debts) {
                    debts[key] = 0;
                }
                renderDebts();
            }
        }

        renderDebts();
    </script>
</body>
</html>
