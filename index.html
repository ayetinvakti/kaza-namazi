<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
        // Tema ve Özel Renk Paleti Kontrolü (Sayfa yüklenmeden önce çalışır, titremeyi önler)
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.classList.add('light-mode');
        }

        // Ayarlardan kaydedilen özel renkleri hemen uygula
        const savedAccent = localStorage.getItem('custom_accent');
        const savedBg = localStorage.getItem('custom_bg');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--primary-color', savedAccent);
        if (savedBg) {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg', savedBg);
        }
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page_title">Ayetin Vakti - Kaza Namazı Takibi</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #10b981;
            --border-color: #334155;
            --btn-minus-bg: #334155;
        }

        html.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --primary-color: #0d9488;
            --border-color: #e2e8f0;
            --btn-minus-bg: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        header {
            padding: 14px 16px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-color);
        }

        .back-btn, .theme-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: var(--card-bg);
        }

        .container {
            flex: 1;
            padding: 16px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card h2 {
            font-size: 1rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reset-all-btn {
            background: none;
            border: 1px solid #ef4444;
            color: #ef4444;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .reset-all-btn:active {
            opacity: 0.7;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .input-group input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            color: var(--text-color);
            font-size: 0.9rem;
            text-align: center;
            outline: none;
            width: 100%;
        }

        .btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
        }

        html:not(.light-mode) .btn {
            color: #0f172a;
        }

        .btn:active {
            opacity: 0.8;
        }

        .debt-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .debt-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .debt-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .debt-info span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .debt-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .debt-actions input {
            width: 65px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px;
            color: var(--text-color);
            text-align: center;
            font-size: 0.9rem;
            outline: none;
        }

        .action-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        html:not(.light-mode) .action-btn {
            color: #0f172a;
        }

        .action-btn.minus {
            background-color: var(--btn-minus-bg);
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <header>
        <a href="https://ayetinvakti.github.io/" class="back-btn" aria-label="Geri">←</a>
        <h1 data-i18n="header_title">⏳ Kaza Namazı Takibi</h1>
        <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Tema Değiştir">🌙</button>
    </header>

    <div class="container">
        <div class="card">
            <h2 data-i18n="calc_header">📊 Pratik Kaza Hesaplayıcı</h2>
            <div class="calc-grid">
                <div class="input-group">
                    <label data-i18n="label_yil">Yıl</label>
                    <input type="number" id="calcYil" placeholder="0" min="0" inputmode="numeric" pattern="[0-9]*">
                </div>
                <div class="input-group">
                    <label data-i18n="label_ay">Ay</label>
                    <input type="number" id="calcAy" placeholder="0" min="0" inputmode="numeric" pattern="[0-9]*">
                </div>
                <div class="input-group">
                    <label data-i18n="label_gun">Gün</label>
                    <input type="number" id="calcGun" placeholder="0" min="0" inputmode="numeric" pattern="[0-9]*">
                </div>
            </div>
            <button class="btn" onclick="hesaplaVeEkle()" data-i18n="btn_ekle">Borçlara Ekle / Güncelle</button>
        </div>

        <div class="card">
            <div class="card-header-row">
                <h2 data-i18n="debts_header">📝 Kaza Borçlarım</h2>
                <button class="reset-all-btn" onclick="tumunuSifirla()" data-i18n="btn_reset">Sıfırla</button>
            </div>
            <div class="debt-list" id="debtList"></div>
        </div>
    </div>

    <script>
        // Dil Sözlüğü
        const translations = {
            tr: {
                page_title: "Ayetin Vakti - Kaza Namazı Takibi",
                header_title: "⏳ Kaza Namazı Takibi",
                calc_header: "📊 Pratik Kaza Hesaplayıcı",
                label_yil: "Yıl",
                label_ay: "Ay",
                label_gun: "Gün",
                btn_ekle: "Borçlara Ekle / Güncelle",
                debts_header: "📝 Kaza Borçlarım",
                btn_reset: "Sıfırla",
                sabah: "Sabah Namazı",
                ogle: "Öğle Namazı",
                ikindi: "İkindi Namazı",
                aksam: "Akşam Namazı",
                yatsi: "Yatsı Namazı",
                vitir: "Vitir Namazı",
                kalan_borc: "Kalan Borç: ",
                vakit: " vakit",
                alert_gecersiz: "Lütfen geçerli bir süre girin kardeşim!",
                alert_eklendi: " günlük kaza borcu listeye başarıyla eklendi kardeşim!",
                confirm_sifirla: "Tüm kaza borçlarını sıfırlamak istediğinden emin misin kardeşim?"
            },
            en: {
                page_title: "Ayetin Vakti - Qada Prayer Tracker",
                header_title: "⏳ Qada Prayer Tracker",
                calc_header: "📊 Quick Qada Calculator",
                label_yil: "Year",
                label_ay: "Month",
                label_gun: "Day",
                btn_ekle: "Add / Update Debts",
                debts_header: "📝 My Qada Debts",
                btn_reset: "Reset",
                sabah: "Fajr Prayer",
                ogle: "Dhuhr Prayer",
                ikindi: "Asr Prayer",
                aksam: "Maghrib Prayer",
                yatsi: "Isha Prayer",
                vitir: "Witr Prayer",
                kalan_borc: "Remaining Debt: ",
                vakit: " prayers",
                alert_gecersiz: "Please enter a valid duration, my friend!",
                alert_eklendi: " days of qada debt successfully added to the list!",
                confirm_sifirla: "Are you sure you want to reset all qada debts, my friend?"
            },
            ar: {
                page_title: "آية الوقت - تتبع الصلوات الفوائت",
                header_title: "⏳ تتبع الصلوات الفوائت",
                calc_header: "📊 حاسبة الفوائت السريعة",
                label_yil: "سنة",
                label_ay: "شهر",
                label_gun: "يوم",
                btn_ekle: "إضافة / تحديث الديون",
                debts_header: "📝 ديوني من الصلوات",
                btn_reset: "إعادة تعيين",
                sabah: "صلاة الفجر",
                ogle: "صلاة الظهر",
                ikindi: "صلاة العصر",
                aksam: "صلاة المغرب",
                yatsi: "صلاة العشاء",
                vitir: "صلاة الوتر",
                kalan_borc: "الدين المتبقي: ",
                vakit: " صلاة",
                alert_gecersiz: "الرجاء إدخال مدة صحيحة يا أخي!",
                alert_eklendi: " أيام من قضاء الصلاة أضيفت بنجاح للقائمة يا أخي!",
                confirm_sifirla: "هل أنت متأكد أنك تريد إعادة تعيين جميع ديون الصلوات يا أخي؟"
            }
        };

        const currentLang = localStorage.getItem('user_lang') || 'tr';

        // Tema Ayarları
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        function updateThemeButton(isLight) {
            themeToggleBtn.textContent = isLight ? '☀️' : '🌙';
        }

        function setTheme(isLight) {
            if (isLight) {
                document.documentElement.classList.add('light-mode');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.remove('light-mode');
                localStorage.setItem('theme', 'dark');
            }
            updateThemeButton(isLight);
        }

        function toggleTheme() {
            const isLight = document.documentElement.classList.contains('light-mode');
            setTheme(!isLight);
        }

        // İlk yükleme tema durumu
        const isLightInitial = document.documentElement.classList.contains('light-mode');
        updateThemeButton(isLightInitial);

        // Kaza Borçları Mantığı
        let debts = JSON.parse(localStorage.getItem('kazaBorclari')) || {
            sabah: 0,
            ogle: 0,
            ikindi: 0,
            aksam: 0,
            yatsi: 0,
            vitir: 0
        };

        const debtKeys = ['sabah', 'ogle', 'ikindi', 'aksam', 'yatsi', 'vitir'];

        function renderDebts() {
            const listContainer = document.getElementById('debtList');
            listContainer.innerHTML = '';

            const t = translations[currentLang] || translations['tr'];

            debtKeys.forEach(key => {
                let name = t[key] || key;
                listContainer.innerHTML += `
                    <div class="debt-item">
                        <div class="debt-info">
                            <h3>${name}</h3>
                            <span>${t.kalan_borc}${debts[key]}${t.vakit}</span>
                        </div>
                        <div class="debt-actions">
                            <button class="action-btn minus" onclick="changeDebt('${key}', -1)">-</button>
                            <input type="number" id="input-${key}" value="${debts[key]}" onchange="updateDirect('${key}', this.value)" inputmode="numeric" pattern="[0-9]*">
                            <button class="action-btn" onclick="changeDebt('${key}', 1)">+</button>
                        </div>
                    </div>
                `;
            });
            localStorage.setItem('kazaBorclari', JSON.stringify(debts));
        }

        function changeDebt(key, amount) {
            debts[key] = Math.max(0, debts[key] + amount);
            renderDebts();
        }

        function updateDirect(key, value) {
            let val = parseInt(value);
            debts[key] = isNaN(val) || val < 0 ? 0 : val;
            renderDebts();
        }

        function hesaplaVeEkle() {
            let yil = parseInt(document.getElementById('calcYil').value) || 0;
            let ay = parseInt(document.getElementById('calcAy').value) || 0;
            let gun = parseInt(document.getElementById('calcGun').value) || 0;

            let toplamGun = (yil * 365) + (ay * 30) + gun;
            const t = translations[currentLang] || translations['tr'];

            if (toplamGun <= 0) {
                alert(t.alert_gecersiz);
                return;
            }

            debtKeys.forEach(key => {
                debts[key] += toplamGun;
            });

            document.getElementById('calcYil').value = '';
            document.getElementById('calcAy').value = '';
            document.getElementById('calcGun').value = '';

            renderDebts();
            alert(toplamGun + t.alert_eklendi);
        }

        function tumunuSifirla() {
            const t = translations[currentLang] || translations['tr'];
            if (confirm(t.confirm_sifirla)) {
                debtKeys.forEach(key => {
                    debts[key] = 0;
                });
                renderDebts();
            }
        }

        // Sayfa Metinlerini Dile Göre Düzenleme
        if (translations[currentLang]) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    if (element.tagName === 'TITLE') {
                        document.title = translations[currentLang][key];
                    } else {
                        element.textContent = translations[currentLang][key];
                    }
                }
            });
            if (currentLang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
            }
        }

        renderDebts();
    </script>
</body>
</html>
